# 构建 Docker 镜像。推到 main、或者推 v 开头的版本标签（如 v1.2.0）时构建并推送到
# GitHub 的容器镜像仓库 ghcr.io；拉取请求里只构建、不推送，提前发现 Dockerfile 的问题。
# 镜像同时有 linux/amd64 和 linux/arm64 两个版本。
name: Docker 镜像

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# 同一个分支连着推了几次时，只构建最新的那次
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      # ghcr.io 的镜像名必须全是小写，仓库名里有大写字母
      - name: 确定镜像名
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # arm64 的那一份靠 QEMU 模拟构建
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: 登录 ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 标签：main 上是 latest；版本标签 v1.2.3 生成 1.2.3 和 1.2；每次都有一个 sha-<提交号>
      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
